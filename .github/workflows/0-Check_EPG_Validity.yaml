name: 0 Check EPG Validity

on:
  # schedule:
    # - cron: '20 * * * *'          # 每小时的20分运行
  workflow_dispatch:              # 支持手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pytz
        run: pip install pytz

      - name: Update EPG status
        run: |
          python << 'EOF'
          import json
          import re
          from datetime import datetime, timezone, timedelta
          import pytz

          # 北京时间 (UTC+8)
          BEIJING_TZ = timezone(timedelta(hours=8))
          NOW = datetime.now(BEIJING_TZ)

          def is_valid(start_str, end_str):
              if not start_str or not end_str:
                  return False
              try:
                  start = datetime.strptime(start_str, "%Y-%m-%d %H:%M:%S").replace(tzinfo=BEIJING_TZ)
                  end = datetime.strptime(end_str, "%Y-%m-%d %H:%M:%S").replace(tzinfo=BEIJING_TZ)
                  return start <= NOW <= end
              except ValueError:
                  return False

          # ---------- 更新 snow_epg.json ----------
          with open('snow_epg.json', 'r', encoding='utf-8') as f:
              channels = json.load(f)

          valid_map = {}
          for ch in channels:
              dr = ch.get('date_range', {})
              valid = is_valid(dr.get('start'), dr.get('end'))
              ch['is_valid'] = valid
              valid_map[ch['channel_id']] = valid

          with open('snow_epg.json', 'w', encoding='utf-8') as f:
              json.dump(channels, f, ensure_ascii=False, indent=2)

          # ---------- 更新 README.md ----------
          with open('README.md', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              stripped = line.rstrip('\n')
              # 只处理表格数据行（以 | 开头，不含 ---，且不是表头）
              if stripped.startswith('|') and '---' not in stripped:
                  if re.search(r'频道id|频道名称', stripped):   # 跳过表头行
                      new_lines.append(line)
                      continue

                  parts = stripped.split('|')
                  if len(parts) >= 3:
                      ch_id = parts[1].strip()
                      if ch_id in valid_map:
                          status = '✅' if valid_map[ch_id] else '❌'
                          parts[-2] = f' {status} '      # 更新最后一列（倒数第二项）
                          line = '|'.join(parts) + '\n'
              new_lines.append(line)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)

          print("EPG validity check completed.")
          EOF

      - name: Commit and push changes with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull origin ${{ github.ref_name }} --rebase --autostash
            git add README.md snow_epg.json
            
            export TZ='Asia/Shanghai'
            commit_time=$(date +'%Y-%m-%d %H:%M:%S %Z')
            git diff --staged --quiet || git commit -m "Automated EPG validity update [$commit_time]"
            git push